<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0B1120" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Evergrove" />
    <title>Evergrove</title>
    <base href="./" />
    <link rel="stylesheet" href="css/app.css?v=v2026.07.14.10" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
</head>
<body>
    <div id="app">
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0B1120;color:#94A3B8;font-family:system-ui,sans-serif;flex-direction:column;gap:12px;">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                <circle class="loading-ring loading-ring-3" cx="20" cy="20" r="11.76" stroke="#10B981" stroke-opacity="0.35" stroke-width="1.4"/>
                <circle class="loading-ring loading-ring-2" cx="20" cy="20" r="8" stroke="#10B981" stroke-opacity="0.65" stroke-width="1.4"/>
                <circle class="loading-ring loading-ring-1" cx="20" cy="20" r="4.24" fill="#10B981"/>
            </svg>
            <span style="font-size:14px">Loading Evergrove…</span>
        </div>
    </div>
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <div class="error-detail"></div>
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <!-- db.js must load synchronously BEFORE Blazor -->
    <script src="js/db.js?v=v2026.07.14.10"></script>
    <script src="js/push.js?v=v2026.07.14.10"></script>
    <script>
        // Tracked so nudgeRepaint (below) can defer instead of fighting an
        // in-progress touch-scroll gesture or the short momentum phase after
        // the finger lifts — see the comment on nudgeRepaint.
        let financeBladeTouchActive = false;
        let financeBladeTouchIdleTimer = 0;
        document.addEventListener('touchstart', () => { financeBladeTouchActive = true; }, { passive: true });
        const financeBladeSetTouchIdleSoon = () => {
            clearTimeout(financeBladeTouchIdleTimer);
            financeBladeTouchIdleTimer = setTimeout(() => { financeBladeTouchActive = false; }, 350);
        };
        document.addEventListener('touchend', financeBladeSetTouchIdleSoon, { passive: true });
        document.addEventListener('touchcancel', financeBladeSetTouchIdleSoon, { passive: true });

        // WKWebView (standalone iOS PWA) doesn't shrink the layout viewport when
        // the on-screen keyboard opens — it just overlays it. Fixed-position bars
        // pinned to bottom:0 (.modal-actions) stay where they were, now hidden
        // behind the keyboard: visible nowhere, tappable nowhere. visualViewport
        // tracks the actual visible area, so use it to lift those bars clear.
        if (window.visualViewport) {
            const vv = window.visualViewport;
            const updateKeyboardInset = () => {
                const inset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
                document.documentElement.style.setProperty('--kb-inset', inset > 1 ? `${inset}px` : '0px');
            };
            vv.addEventListener('resize', updateKeyboardInset, { passive: true });
            vv.addEventListener('scroll', updateKeyboardInset, { passive: true });
            updateKeyboardInset();
        }

        // nudgeRepaint's body display:none/'' toggle blurs whatever input is
        // focused — on iOS this dismisses the keyboard mid-typing (the
        // accessory toolbar can linger with no keyboard under it, and the
        // field won't accept input again until the user taps out and back
        // in). Defer the same way as an in-progress touch gesture.
        const financeBladeIsTextInput = () => {
            const el = document.activeElement;
            return !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
        };

        window.financeBlade = {
            repairScroll: () => {
                const page = document.querySelector('.page-content');
                if (!page) return;
                page.style.overflowY = 'auto';
                page.style.touchAction = 'pan-x pan-y';
                // Force WebKit to re-evaluate the scrollable layer without
                // changing the user's position or rebuilding the scrolling
                // element mid-gesture.
                const y = page.scrollTop;
                page.style.webkitTransform = 'translate3d(0,0,0)';
                page.style.transform = 'translate3d(0,0,0)';
                void page.offsetHeight;
                page.style.webkitTransform = '';
                page.style.transform = '';
                page.scrollTop = y;
                // html/body are position:fixed + overflow:hidden — they should
                // never carry any scroll offset or transform of their own. iOS's
                // automatic scroll-into-view for a focused input can still nudge
                // this outer frame (a transform, or a native scroll despite
                // overflow:hidden) and leaves it there after the keyboard
                // dismisses. A swipe then fights that residual offset instead of
                // scrolling .page-content — the page visibly shifts but nothing
                // actually scrolls. Reset the outer frame back to its pinned
                // baseline without touching .page-content's own scroll position.
                document.documentElement.style.transform = '';
                document.body.style.transform = '';
                window.scrollTo(0, 0);
                document.documentElement.scrollTop = 0;
                document.body.scrollTop = 0;
            },
            scrollPageToTop: () => {
                if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
                const reset = () => {
                    const page = document.querySelector('.page-content');
                    if (page) page.scrollTop = 0;
                    window.scrollTo(0, 0);
                    document.documentElement.scrollTop = 0;
                    document.body.scrollTop = 0;
                };
                reset();
                requestAnimationFrame(() => {
                    window.financeBlade.repairScroll();
                    reset();
                    requestAnimationFrame(reset);
                });
            },
            downloadFile: (filename, content, mime) => {
                const blob = new Blob([content], { type: mime || 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            },
            _visibleCallback: null,
            registerOnVisible: (dotnetRef) => {
                window.financeBlade._visibleCallback = dotnetRef;
            },
            // Forces WKWebView to repaint. iOS's WKWebView frequently fails to
            // flush the screen after DOM updates driven purely by async/await
            // (IndexedDB, fetch, background sync) with no user gesture in the
            // call stack, leaving the last-painted frame (e.g. the loading
            // spinner, or a badge that's already gone in the DOM) stuck on
            // screen until a touch event forces a reflow. A single
            // display-toggle isn't reliably enough on every iOS/WKWebView
            // build, so this stacks a few different reflow/composite triggers
            // and retries briefly in case the first attempt races WKWebView's
            // own repaint scheduling.
            //
            // This fires after every background sync (MainLayout's 1-minute
            // PeriodicTimer included), with no relation to what the user is
            // doing — if it lands while a touch-scroll is in progress, the
            // body display:none toggle plus the forced scrollTop restore below
            // both fight the gesture mid-flight (interrupted scroll, a snap to
            // a stale position, then the native elastic-bounce reacting to
            // that snap). Defer until the finger lifts instead of doing that.
            nudgeRepaint: () => {
                if (financeBladeTouchActive) {
                    document.addEventListener('touchend', () => setTimeout(() => window.financeBlade.nudgeRepaint(), 380), { once: true, passive: true });
                    return;
                }
                if (financeBladeIsTextInput()) {
                    document.addEventListener('focusout', () => window.financeBlade.nudgeRepaint(), { once: true, passive: true });
                    return;
                }
                const nudgeOnce = () => {
                    if (financeBladeIsTextInput()) return;
                    const root = document.documentElement;
                    const app = document.getElementById('app');
                    root.style.webkitTransform = 'translate3d(0,0,0)';
                    root.style.transform = 'translate3d(0,0,0)';
                    void root.offsetHeight;
                    root.style.webkitTransform = '';
                    root.style.transform = '';
                    if (app) {
                        app.style.webkitTransform = 'translate3d(0,0,0)';
                        app.style.transform = 'translate3d(0,0,0)';
                        void app.offsetHeight;
                        app.style.webkitTransform = '';
                        app.style.transform = '';
                    }
                    const page = document.querySelector('.page-content');
                    const pageScrollTop = page ? page.scrollTop : 0;
                    window.financeBlade.repairScroll();
                    requestAnimationFrame(() => {
                        if (page) page.scrollTop = pageScrollTop;
                        document.dispatchEvent(new Event('financeblade:paint-nudge'));
                    });
                };
                nudgeOnce();
                requestAnimationFrame(() => requestAnimationFrame(nudgeOnce));
                [50, 150, 400, 900].forEach(ms => setTimeout(nudgeOnce, ms));
            }
        };
        // ── Network status ────────────────────────────────────────────────────
        window.financeBlade.getOnlineStatus = () => navigator.onLine;
        window.financeBlade.listenNetworkStatus = dotnetRef => {
            const notify = () => {
                try { dotnetRef.invokeMethodAsync('OnNetworkStatusChanged', navigator.onLine); } catch {}
            };
            window.addEventListener('online',  notify, { passive: true });
            window.addEventListener('offline', notify, { passive: true });
        };
        // ── Pull-to-refresh ───────────────────────────────────────────────────
        // Detect a downward drag from the top of .page-content and invoke a sync.
        // .page-content has overscroll-behavior-y:contain so there's no native
        // bounce to fight — we just translate a custom indicator with touch events.
        window.financeBlade.setupPullToRefresh = dotnetRef => {
            let startY = 0, isPulling = false, indicator = null;
            const THRESHOLD = 72;
            const page = () => document.querySelector('.page-content');
            const dismissIndicator = (ind, delay) => {
                setTimeout(() => {
                    ind.style.transition = 'opacity 0.25s ease, padding 0.25s ease';
                    ind.style.opacity = '0';
                    ind.style.setProperty('--ptr-h', '0px');
                    setTimeout(() => ind.remove(), 280);
                }, delay);
            };
            document.addEventListener('touchstart', e => {
                const p = page(); if (!p || p.scrollTop > 2) return;
                if (e.target.closest('button,a,input,select,textarea,[role="button"]')) return;
                if (!e.target.closest('.page-content')) return;
                // Ignore touches starting in the iOS home-indicator zone (bottom ~80 px)
                if (e.touches[0].clientY > window.innerHeight - 80) return;
                startY = e.touches[0].clientY; isPulling = false;
            }, { passive: true });
            document.addEventListener('touchmove', e => {
                const p = page(); if (!p || p.scrollTop > 2) { isPulling = false; return; }
                const dy = e.touches[0].clientY - startY;
                if (dy < 10) { return; }
                isPulling = true;
                if (!indicator) { indicator = document.createElement('div'); indicator.className = 'ptr-indicator'; p.prepend(indicator); }
                const pull = Math.min(dy, 110);
                indicator.style.transition = '';
                indicator.style.setProperty('--ptr-h', Math.min(pull * 0.35, 36) + 'px');
                indicator.style.opacity = String(Math.min((pull / THRESHOLD) * 1.5, 1));
                indicator.textContent = pull >= THRESHOLD ? '↑ Release to sync' : '↓ Pull to sync';
            }, { passive: true });
            document.addEventListener('touchend', async e => {
                if (!isPulling) return;
                const dy = e.changedTouches[0].clientY - startY;
                const go = dy >= THRESHOLD; isPulling = false;
                if (indicator) {
                    const ind = indicator; indicator = null;
                    if (go) { ind.textContent = 'Syncing…'; ind.style.opacity = '1'; dismissIndicator(ind, 900); }
                    else { dismissIndicator(ind, 0); }
                }
                if (go) try { await dotnetRef.invokeMethodAsync('TriggerPullRefreshAsync'); } catch {}
            }, { passive: true });
        };
        // ── Swipe-to-dismiss modals ───────────────────────────────────────────
        // Downward swipe on a .modal-card (from the handle/title or when the
        // scrollable .modal-sheet is at the top) clicks the .modal-backdrop to
        // close — the same as tapping the backdrop overlay.
        window.financeBlade.enableSwipeDismiss = () => {
            let startY = 0, card = null, backdrop = null, sheet = null;
            const THRESHOLD = 90;
            document.addEventListener('touchstart', e => {
                const c = e.target.closest('.modal-card'); if (!c) return;
                const sh = c.querySelector('.modal-sheet');
                const onHandle = !!e.target.closest('.modal-handle,.modal-title');
                if (!onHandle && sh && sh.scrollTop > 4) return;
                card = c; sheet = sh; backdrop = c.closest('.modal-backdrop');
                startY = e.touches[0].clientY; card.style.transition = 'none';
            }, { passive: true });
            document.addEventListener('touchmove', e => {
                if (!card) return;
                if (sheet && sheet.scrollTop > 0) { card.style.transform = ''; card = null; return; }
                const dy = e.touches[0].clientY - startY;
                if (dy < 0) return;
                card.style.transform = `translateY(${dy}px)`;
            }, { passive: true });
            document.addEventListener('touchend', e => {
                if (!card) return;
                const dy = e.changedTouches[0].clientY - startY;
                if (dy >= THRESHOLD && backdrop) {
                    card.style.transition = 'transform 0.2s ease';
                    card.style.transform = 'translateY(100%)';
                    const bd = backdrop;
                    setTimeout(() => { try { bd.click(); } catch {} }, 180);
                } else {
                    card.style.transition = 'transform 0.25s cubic-bezier(0.34,1.56,0.64,1)';
                    card.style.transform = '';
                }
                card = null; backdrop = null; sheet = null;
            }, { passive: true });
        };
        (() => {
            let startX = 0;
            let startY = 0;
            let startedAt = 0;
            let handledBackSwipe = false;
            const interactiveFor = target => target?.closest?.('button, a, input, select, textarea, [role="button"], .pill-tabs, .mini-timeline');
            document.addEventListener('touchstart', event => {
                const touch = event.touches?.[0];
                startX = touch?.clientX || 0;
                startY = touch?.clientY || 0;
                startedAt = Date.now();
                handledBackSwipe = false;
            }, { passive: true });
            document.addEventListener('touchmove', event => {
                if (handledBackSwipe || interactiveFor(event.target)) return;
                const touch = event.touches?.[0];
                if (!touch) return;
                const dx = touch.clientX - startX;
                const dy = touch.clientY - startY;
                const fastEnough = Date.now() - startedAt < 700;
                const mostlyHorizontal = Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6;
                const fromLeftEdge = startX <= 34 && dx > 0;
                const fromRightEdge = startX >= window.innerWidth - 34 && dx < 0;
                if (fastEnough && mostlyHorizontal && (fromLeftEdge || fromRightEdge) && history.length > 1) {
                    handledBackSwipe = true;
                    history.back();
                }
            }, { passive: true });
        })();
    </script>
    <script>
        // ── Resume / black-screen recovery (iOS PWA) ────────────────────────
        // After the Home Screen app is backgrounded, iOS sometimes resumes it
        // to a frozen/black WKWebView (a stuck framework fetch, or a render
        // that never repaints). Reload to recover instead of the user having
        // to swipe the app away and relaunch it.
        (() => {
            const RELOAD_GUARD_KEY = 'fb-last-reload';
            const MIN_RELOAD_GAP_MS = 15000;
            const safeReload = () => {
                const last = Number(sessionStorage.getItem(RELOAD_GUARD_KEY) || 0);
                if (Date.now() - last < MIN_RELOAD_GAP_MS) return;
                sessionStorage.setItem(RELOAD_GUARD_KEY, String(Date.now()));
                window.location.reload();
            };

            // Page restored from bfcache (frozen JS) — always reload.
            window.addEventListener('pageshow', event => {
                if (event.persisted) safeReload();
            });

            // Boot watchdog: if Blazor hasn't signalled it started within 20s,
            // reload once (covers a hung framework fetch on cold start).
            const bootTimeout = setTimeout(() => {
                if (!window.__financeBladeStarted) safeReload();
            }, 20000);
            window.financeBlade.appStarted = () => {
                window.__financeBladeStarted = true;
                clearTimeout(bootTimeout);
            };

            // On resume: nudge a reflow (works around WKWebView staying black
            // after backgrounding); if the app still hasn't booted shortly
            // after, reload; if Blazor is already running, trigger a sync so
            // changes made on the PC while this app was backgrounded are picked
            // up immediately without waiting for the 1-minute periodic timer.
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState !== 'visible') return;
                window.financeBlade.nudgeRepaint();
                if (!window.__financeBladeStarted) {
                    setTimeout(() => {
                        if (!window.__financeBladeStarted) safeReload();
                    }, 2000);
                } else {
                    try {
                        window.financeBlade._visibleCallback?.invokeMethodAsync('OnBrowserVisible');
                    } catch (_) {}
                }
            });
        })();
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        (() => {
            const showError = message => {
                const detail = document.querySelector('#blazor-error-ui .error-detail');
                if (detail) detail.textContent = String(message || '').slice(0, 500);
            };
            window.addEventListener('error', event => showError(event.error?.message || event.message));
            window.addEventListener('unhandledrejection', event => showError(event.reason?.message || event.reason));
        })();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
            // Force the browser to check for a new service worker on every launch.
            // Combined with network-first navigation, this ensures updates are picked
            // up immediately without any forced page reloads.
            navigator.serviceWorker.ready.then(r => r.update()).catch(() => {});
        }
    </script>
</body>
</html>
