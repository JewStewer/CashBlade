name: Bill Reminders

on:
  schedule:
    # Every day at 8:00 AM UTC (6 PM AEST)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allow manual trigger for testing

# Opt into Node.js 24 for actions now — becomes mandatory June 16th 2026
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web-push
        run: npm install web-push

      - name: Send bill reminders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_EMAIL: ${{ secrets.VAPID_EMAIL }}
        run: node .github/scripts/send-bill-reminders.js
